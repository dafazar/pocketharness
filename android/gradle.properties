# FIX: GitHub Actions ubuntu-latest only has ~7GB total RAM.
# -Xmx8g caused OOM → OS sent SIGTERM (exit code 143 / "operation canceled").
# 4g is the safe ceiling: leaves room for NDK/CMake workers + OS overhead.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# FIX: daemon=false untuk CI — daemon reuse watcher menyebabkan "Already watching path"
# Untuk build lokal, developer bisa override di ~/.gradle/gradle.properties
org.gradle.daemon=false
# FIX: parallel=false — parallel workers spike memory simultaneously during NDK compilation
# causing OOM. Disable for CI; re-enable locally via ~/.gradle/gradle.properties if desired.
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
# Nonaktifkan R8 full mode untuk cegah strip JNI symbols
android.enableR8.fullMode=false
