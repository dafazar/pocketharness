# ══════════════════════════════════════════════════════════════════════════════
# KanMon GO — GitHub Actions Build Workflow
# ══════════════════════════════════════════════════════════════════════════════
name: 🚀 Build KanMon GO

"on":
  workflow_dispatch:
    inputs:
      build_target:
        description: "🎯 Pilih jenis build"
        required: true
        default: "apk-release-arm64"
        type: choice
        options:
          - apk-release-arm64
          - apk-release
          - apk-split-abi
          - apk-debug
          - aab
          - all-android
          - ios
      flutter_channel:
        description: "🐦 Flutter channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      enable_obfuscation:
        description: "🔒 Dart obfuscation (hanya release builds)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:

  android:
    name: "🤖 Android — ${{ github.event_name == 'push' && 'apk-release (auto push)' || github.event.inputs.build_target }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # FIX Bug 3: naik ke 90 menit — cold llama.cpp build butuh ~50-60 menit
    timeout-minutes: 90

    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_target == 'apk-release'      ||
      github.event.inputs.build_target == 'apk-release-arm64'||
      github.event.inputs.build_target == 'apk-split-abi'    ||
      github.event.inputs.build_target == 'apk-debug'        ||
      github.event.inputs.build_target == 'aab'               ||
      github.event.inputs.build_target == 'all-android'

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
      # Suppress "Operation not permitted" tar warnings when restoring NDK cache
      # from pre-installed SDK paths on the runner
      TAR_OPTIONS: "--no-same-permissions"

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "💾 Cache Android SDK platforms"
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-platforms-36-35-34

      - name: "📱 Install Android SDK platforms"
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_SDK_ROOT" 2>&1 | grep -E "^(Downloading|Installing|done|License)" || true

      - name: "🐦 Flutter (${{ github.event.inputs.flutter_channel || 'stable' }})"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: "🐦 Flutter version"
        run: flutter --version

      - name: "🗑️ Remove sensitive files"
        run: |
          rm -f CLAUDE.md AUDIT_REPORT.md
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -delete 2>/dev/null || true
          rm -f .env .env.local secrets.json keys.json

      - name: "📦 Cache pub"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: android-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: android-pub-${{ runner.os }}-

      - name: "📦 flutter pub get"
        run: flutter pub get

      # ── SESSION_01: Bundle Node.js + Claude Code CLI + code-server ────────────

      - name: "💻 Resolve code-server version"
        id: resolve-codeserver
        run: |
          CS_VERSION=$(curl -sf https://registry.npmjs.org/code-server/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
          if [ -z "$CS_VERSION" ]; then
            CS_VERSION="4.93.1"
          fi
          echo "  📌 code-server version: $CS_VERSION"
          echo "cs_version=$CS_VERSION" >> "$GITHUB_OUTPUT"

      - name: "🟢 Resolve Node.js LTS version"
        id: resolve-nodejs
        run: |
          NODE_VERSION=$(curl -sf https://nodejs.org/dist/index.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); lts=[v for v in d if v.get('lts') and v['version'].startswith('v22')]; print(lts[0]['version'].lstrip('v'))" \
            2>/dev/null || echo "22.14.0")
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "  📌 Node.js: $NODE_VERSION"

      - name: "🔍 Determine ABIs for build target"
        id: abis
        run: |
          TARGET="${{ github.event.inputs.build_target }}"
          case "$TARGET" in
            apk-release-arm64|apk-debug)
              ABIS="arm64-v8a"
              ;;
            apk-split-abi|all-android|apk-release)
              ABIS="arm64-v8a x86_64"
              ;;
            aab)
              ABIS="arm64-v8a"
              ;;
            *)
              ABIS="arm64-v8a"
              ;;
          esac
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "  📌 ABIs to bundle: $ABIS"

      - name: "💾 Cache bundled tools"
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: assets/tools
          key: tools-bundle-node${{ steps.resolve-nodejs.outputs.node_version }}-cs${{ steps.resolve-codeserver.outputs.cs_version }}-${{ steps.abis.outputs.abis }}

      - name: "📦 Bundle Node.js + Claude Code + code-server + CLI tools"
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NODE_VERSION="${{ steps.resolve-nodejs.outputs.node_version }}"
          CS_VERSION="${{ steps.resolve-codeserver.outputs.cs_version }}"
          ABIS="${{ steps.abis.outputs.abis }}"
          TOOLS_DIR="assets/tools"

          sudo apt-get install -y binutils -qq

          mkdir -p "$TOOLS_DIR/launcher"

          for ABI in $ABIS; do
            echo "  ⚙️  Bundling for ABI: $ABI"
            mkdir -p "$TOOLS_DIR/$ABI/npm_modules"
            mkdir -p "$TOOLS_DIR/$ABI/bin"

            # ── Node.js binary ────────────────────────────────────────────────
            case "$ABI" in
              arm64-v8a) NODE_ARCH="arm64" ;;
              x86_64)    NODE_ARCH="x64"   ;;
            esac
            NODE_TARBALL="node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.gz"
            NODE_URL="https://nodejs.org/dist/v${NODE_VERSION}/${NODE_TARBALL}"
            echo "    ⬇️  Node.js: $NODE_URL"
            curl -fsSL "$NODE_URL" -o "/tmp/${NODE_TARBALL}"
            tar -xzf "/tmp/${NODE_TARBALL}" -C /tmp --strip-components=1 \
              "node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/node"
            mv /tmp/bin/node "$TOOLS_DIR/$ABI/node"
            chmod 755 "$TOOLS_DIR/$ABI/node"

            # ── npm module ────────────────────────────────────────────────────
            tar -xzf "/tmp/${NODE_TARBALL}" -C /tmp --strip-components=1 \
              "node-v${NODE_VERSION}-linux-${NODE_ARCH}/lib/node_modules/npm"
            cp -r /tmp/lib/node_modules/npm "$TOOLS_DIR/$ABI/npm_modules/npm"
            rm -rf /tmp/lib /tmp/bin "/tmp/${NODE_TARBALL}"

            # ── Claude Code CLI ───────────────────────────────────────────────
            CC_INSTALL="/tmp/cc_install_${ABI}"
            rm -rf "$CC_INSTALL"
            mkdir -p "$CC_INSTALL"
            node "$TOOLS_DIR/$ABI/npm_modules/npm/bin/npm-cli.js" install \
              --prefix "$CC_INSTALL" --global \
              "@anthropic-ai/claude-code" \
              2>&1 | tail -5
            CLAUDE_CODE_VERSION=$(node -e "try{const p=require('$CC_INSTALL/lib/node_modules/@anthropic-ai/claude-code/package.json');console.log(p.version);}catch(e){console.log('unknown');}" 2>/dev/null || echo "unknown")
            mkdir -p "$TOOLS_DIR/$ABI/npm_modules/@anthropic-ai"
            cp -r "$CC_INSTALL/lib/node_modules/@anthropic-ai/claude-code" \
              "$TOOLS_DIR/$ABI/npm_modules/@anthropic-ai/"
            echo "    ✅ Claude Code CLI: $CLAUDE_CODE_VERSION"

            # ── code-server ───────────────────────────────────────────────────
            CS_INSTALL="/tmp/cs_install_${ABI}"
            rm -rf "$CS_INSTALL"
            mkdir -p "$CS_INSTALL"
            NODE_MAJOR=$(node --version | grep -oE '[0-9]+' | head -1)
            FORCE_NODE_VERSION="$NODE_MAJOR" \
              "$TOOLS_DIR/$ABI/node" "$TOOLS_DIR/$ABI/npm_modules/npm/bin/npm-cli.js" install \
              --prefix "$CS_INSTALL" --global \
              "code-server@${CS_VERSION}" \
              2>&1 | tail -5
            cp -r "$CS_INSTALL/lib/node_modules/code-server" \
              "$TOOLS_DIR/$ABI/npm_modules/code-server"
            echo "    ✅ code-server: $CS_VERSION"

            # ── Termux prebuilt binaries ──────────────────────────────────────
            case "$ABI" in
              arm64-v8a) TERMUX_ARCH="aarch64" ;;
              x86_64)    TERMUX_ARCH="x86_64"  ;;
            esac
            TERMUX_POOL="https://packages.termux.dev/apt/termux-main/pool/main"

            for PKG_INFO in \
              "g/git/git" \
              "r/ripgrep/ripgrep" \
              "o/openssh/openssh-sftp-server"; do
              PKG_LETTER=$(echo "$PKG_INFO" | cut -d/ -f1)
              PKG_DIR=$(echo "$PKG_INFO" | cut -d/ -f2)
              PKG_NAME=$(echo "$PKG_INFO" | cut -d/ -f3)
              echo "    ⬇️  Fetching $PKG_NAME for $TERMUX_ARCH"
              DEB_URL=$(curl -sf "${TERMUX_POOL}/${PKG_LETTER}/${PKG_DIR}/" \
                | grep -o 'href="[^"]*'"$TERMUX_ARCH"'[^"]*\.deb"' \
                | grep -v 'dbgsym\|dev\|doc' \
                | head -1 \
                | sed 's/href="//;s/"//')
              if [ -z "$DEB_URL" ]; then
                echo "    ⚠️  Could not resolve $PKG_NAME deb, skipping"
                continue
              fi
              FULL_DEB_URL="${TERMUX_POOL}/${PKG_LETTER}/${PKG_DIR}/${DEB_URL##*/}"
              curl -fsSL "$FULL_DEB_URL" -o "/tmp/${PKG_NAME}_${ABI}.deb"
              mkdir -p "/tmp/deb_${PKG_NAME}_${ABI}"
              cd "/tmp/deb_${PKG_NAME}_${ABI}"
              ar x "/tmp/${PKG_NAME}_${ABI}.deb"
              DATA_TAR=$(ls data.tar.* 2>/dev/null | head -1)
              if [ -n "$DATA_TAR" ]; then
                tar -xf "$DATA_TAR" 2>/dev/null || true
                find . -path "*/usr/bin/*" -type f | while read BIN; do
                  cp "$BIN" "$OLDPWD/$TOOLS_DIR/$ABI/bin/$(basename $BIN)" 2>/dev/null || true
                done
                find . -path "*/bin/$PKG_NAME" -type f | while read BIN; do
                  cp "$BIN" "$OLDPWD/$TOOLS_DIR/$ABI/bin/$PKG_NAME" 2>/dev/null || true
                done
              fi
              cd - > /dev/null
              rm -rf "/tmp/deb_${PKG_NAME}_${ABI}" "/tmp/${PKG_NAME}_${ABI}.deb"
            done

            chmod -R 755 "$TOOLS_DIR/$ABI/bin/" 2>/dev/null || true
            chmod 755 "$TOOLS_DIR/$ABI/node"

            echo "  ✅ ABI $ABI bundling complete"
            echo "     Node.js: $(du -sh $TOOLS_DIR/$ABI/node | cut -f1)"
            echo "     npm:     $(du -sh $TOOLS_DIR/$ABI/npm_modules/npm | cut -f1)"
            echo "     Claude:  $(du -sh $TOOLS_DIR/$ABI/npm_modules/@anthropic-ai/claude-code | cut -f1)"
            echo "     CS:      $(du -sh $TOOLS_DIR/$ABI/npm_modules/code-server | cut -f1)"
          done

          # ── Launcher scripts via base64 (YAML-safe) ──────────────────────────
          printf '%s' '' | base64 -d > "$TOOLS_DIR/launcher/claude_code_launcher.sh"
          printf '%s' '' | base64 -d > "$TOOLS_DIR/launcher/code_server_launcher.sh"
          chmod 755 "$TOOLS_DIR/launcher/"*.sh

          # ── tools_manifest.json ───────────────────────────────────────────────
          ABIS_JSON=$(echo "$ABIS" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split()))")
          CLAUDE_VER=$(node -e "try{const p=require('./assets/tools/arm64-v8a/npm_modules/@anthropic-ai/claude-code/package.json');console.log(p.version);}catch(e){console.log('unknown');}" 2>/dev/null || echo "unknown")
          python3 -c 'import json,os,subprocess; m={"schema_version":1,"built_at":subprocess.check_output(["date","-u","+%Y-%m-%dT%H:%M:%SZ"]).decode().strip(),"run_id":os.environ.get("GITHUB_RUN_ID",""),"node_version":os.environ.get("NODE_VERSION",""),"claude_code_version":os.environ.get("CLAUDE_VER",""),"code_server_version":os.environ.get("CS_VERSION",""),"abis":os.environ.get("ABIS","").strip().split(),"tools":["node","npm","claude-code","code-server","git","rg","ssh"]}; open("assets/tools/tools_manifest.json","w").write(json.dumps(m,indent=2)); print("  \u2705 tools_manifest.json written")' NODE_VERSION="$NODE_VERSION" CLAUDE_VER="$CLAUDE_VER" CS_VERSION="$CS_VERSION" ABIS="$ABIS"

          echo "  📁 Total assets/tools size: $(du -sh $TOOLS_DIR | cut -f1)"

      - name: "📋 Register assets/tools in pubspec.yaml"
        run: |
          if ! grep -q "assets/tools/" pubspec.yaml; then
            python3 -c "import re; c=open('pubspec.yaml').read(); entry='    - assets/tools/\\n'; c=(re.sub(r'(  assets:\\n)',r'\\g<1>'+entry,c,count=1) if 'assets:' in c and 'assets/tools/' not in c else c) if 'assets:' in c else c.rstrip()+'\\n\\nflutter:\\n  assets:\\n'+entry+'\\n'; open('pubspec.yaml','w').write(c); print('  \u2705 pubspec.yaml updated')"
          else
            echo "  ✅ assets/tools/ already in pubspec.yaml"
          fi

      # ── END SESSION_01 ────────────────────────────────────────────────────────


      # ── NDK 28 ───────────────────────────────────────────────────────────────
      - name: "💾 Cache NDK 28"
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          key: ndk-28.2.13676358

      - name: "🔧 Install NDK 28"
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          sdkmanager "ndk;28.2.13676358" \
            --sdk_root="$ANDROID_SDK_ROOT" 2>&1 \
            | grep -E "^(Downloading|Installing|done|Warning)" || true

      # ── llama.cpp: resolve tag dulu, baru cache source ────────────────────────
      # FIX Bug 5: cache llama.cpp source → hemat clone ~3 menit per run
      - name: "🦙 Resolve llama.cpp tag"
        id: resolve-tag
        run: |
          LLAMA_REPO="https://github.com/ggerganov/llama.cpp"
          if [ -n "$LLAMA_TAG_OVERRIDE" ]; then
            RESOLVED="$LLAMA_TAG_OVERRIDE"
          else
            RESOLVED=$(git ls-remote --tags "$LLAMA_REPO" 'refs/tags/b[0-9]*' \
              | awk '{print $2}' \
              | sed 's|refs/tags/||' \
              | grep -E '^b[0-9]+$' \
              | sort -t'b' -k2 -n \
              | tail -1)
            if [ -z "$RESOLVED" ]; then
              echo "❌ Gagal resolve tag llama.cpp terbaru!"
              exit 1
            fi
          fi
          echo "  📌 llama.cpp tag: $RESOLVED"
          echo "llama_tag=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "LLAMA_EXTERNAL_DIR=/tmp/llama_src" >> "$GITHUB_ENV"

      - name: "💾 Cache code-server npm package"
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: code-server-npm-${{ steps.resolve-codeserver.outputs.cs_version }}

      - name: "💾 Cache llama.cpp source"
        id: cache-llama-src
        uses: actions/cache@v4
        with:
          path: /tmp/llama_src
          key: llama-src-${{ steps.resolve-tag.outputs.llama_tag }}

      - name: "🦙 Clone llama.cpp source"
        if: steps.cache-llama-src.outputs.cache-hit != 'true'
        run: |
          LLAMA_TAG="${{ steps.resolve-tag.outputs.llama_tag }}"
          TARGET="/tmp/llama_src"
          rm -rf "$TARGET"
          git clone \
            --depth 1 \
            --branch "${LLAMA_TAG}" \
            --filter=blob:none \
            --sparse \
            "https://github.com/ggerganov/llama.cpp" \
            "$TARGET"
          cd "$TARGET"
          git sparse-checkout init --no-cone
          git sparse-checkout set \
            "/CMakeLists.txt" "cmake/**" "include/**" "src/**" "ggml/**" "common/**"
          if ! grep -q "llama_memory_seq_add" "include/llama.h" 2>/dev/null; then
            echo "❌ llama_memory_seq_add tidak ditemukan di ${LLAMA_TAG}"
            exit 1
          fi
          echo "  ✅ llama.cpp ${LLAMA_TAG} siap"

      # ── ccache: SATU blok saja (FIX Bug 1 — duplikat dihapus) ───────────────
      - name: "🔧 Install ccache"
        run: |
          sudo apt-get install -y ccache -qq
          ccache --max-size=2G
          ccache --zero-stats
          echo "  ✅ ccache $(ccache --version | head -1)"

      - name: "💾 Cache ccache objects"
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-llama-${{ runner.os }}-${{ steps.resolve-tag.outputs.llama_tag }}-${{ hashFiles('android/app/src/main/cpp/CMakeLists.txt', 'android/app/src/main/cpp/llama_jni.cpp') }}
          restore-keys: |
            ccache-llama-${{ runner.os }}-${{ steps.resolve-tag.outputs.llama_tag }}-
            ccache-llama-${{ runner.os }}-

      - name: "💾 Add swap space (CI memory guard)"
        run: |
          # ubuntu-latest runners already mount /swapfile — tear it down first
          # so fallocate can overwrite the file cleanly (avoids ETXTBSY).
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          # Re-create at 4 GB to give llama.cpp NDK build enough headroom.
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "  ✅ Swap: $(free -h | grep Swap)"

      # ── FIX Bug 2: Gradle daemon — ganti nilai yang ada, jangan append ───────
      - name: "🔧 Disable Gradle daemon (CI)"
        run: |
          GRADLE_PROPS="android/gradle.properties"
          if grep -q "org.gradle.daemon=" "$GRADLE_PROPS"; then
            sed -i 's/org.gradle.daemon=.*/org.gradle.daemon=false/' "$GRADLE_PROPS"
            echo "  ✅ Replaced: org.gradle.daemon=false"
          else
            echo "org.gradle.daemon=false" >> "$GRADLE_PROPS"
            echo "  ✅ Added: org.gradle.daemon=false"
          fi

      # ── FIX Bug 6: analyze hanya untuk release/aab (skip debug & arm64-cepat) ─
      - name: "🔎 Flutter analyze"
        if: |
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'aab'         ||
          github.event.inputs.build_target == 'all-android'
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 || true

      - name: "🔑 Decode keystore"
        if: |
          github.event_name == 'push'                              ||
          github.event.inputs.build_target == 'apk-release'       ||
          github.event.inputs.build_target == 'apk-release-arm64' ||
          github.event.inputs.build_target == 'apk-split-abi'     ||
          github.event.inputs.build_target == 'aab'                ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "⚠️  KEYSTORE_BASE64 tidak di-set → pakai debug signing"
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            echo "  ✅ Keystore decoded"
          fi

      # ══════════════════════════════════════════════════════════════════════════
      # BUILD VARIANTS
      # ══════════════════════════════════════════════════════════════════════════

      - name: "🔨 Build APK Debug"
        if: github.event.inputs.build_target == 'apk-debug'
        run: |
          flutter build apk --debug --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/flutter-apk/app-debug.apk | cut -f1)  app-debug.apk"

      - name: "📤 Upload APK Debug → GitHub Release"
        if: github.event.inputs.build_target == 'apk-debug'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="gf-latest-debug"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "build/app/outputs/flutter-apk/app-debug.apk" \
            --title "KanMon GO Debug #${{ github.run_number }}" \
            --notes "Debug build #${{ github.run_number }}" \
            --prerelease

      - name: "🏗️ Build APK Release"
        if: |
          github.event_name == 'push'                        ||
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info" || true
          flutter build apk --release --target-platform android-arm64 $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)  app-release.apk"

      - name: "📤 Upload APK Release → GitHub Release"
        if: |
          github.event_name == 'push'                        ||
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="gf-latest-release"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "build/app/outputs/flutter-apk/app-release.apk" \
            --title "KanMon GO Release #${{ github.run_number }}" \
            --notes "Release build #${{ github.run_number }}"

      - name: "⚡ Build APK Release arm64-v8a"
        if: github.event.inputs.build_target == 'apk-release-arm64'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-arm64" || true
          flutter build apk --release --target-platform android-arm64 $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)  app-release-arm64.apk"

      - name: "📤 Upload APK Release arm64 → GitHub Release"
        if: github.event.inputs.build_target == 'apk-release-arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FNAME="KanMon GO-arm64-v${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-release.apk" "$FNAME"
          TAG="gf-latest-arm64"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO arm64 #${{ github.run_number }}" \
            --notes "arm64 release build #${{ github.run_number }}"

      - name: "✂️ Build APK Split per ABI"
        if: |
          github.event.inputs.build_target == 'apk-split-abi' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-split" || true
          flutter build apk --release --split-per-abi $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}

      - name: "📤 Upload Split APKs → GitHub Release"
        if: |
          github.event.inputs.build_target == 'apk-split-abi' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "KanMon GO-arm64-v${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-x86_64-release.apk"    "KanMon GO-x86_64-v${{ github.run_number }}.apk"
          TAG="gf-latest-split"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "KanMon GO-arm64-v${{ github.run_number }}.apk" \
            "KanMon GO-x86_64-v${{ github.run_number }}.apk" \
            --title "KanMon GO Split APK #${{ github.run_number }}" \
            --notes "Split per ABI build #${{ github.run_number }}"

      - name: "📦 Build AAB"
        if: |
          github.event.inputs.build_target == 'aab' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-aab" || true
          flutter build appbundle --release $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1)  app-release.aab"

      - name: "📤 Upload AAB → GitHub Release"
        if: |
          github.event.inputs.build_target == 'aab' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FNAME="KanMon GO-playstore-v${{ github.run_number }}.aab"
          cp "build/app/outputs/bundle/release/app-release.aab" "$FNAME"
          TAG="gf-latest-aab"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO AAB #${{ github.run_number }}" \
            --notes "AAB Play Store build #${{ github.run_number }}"

      - name: "🗑️ Remove keystore"
        if: always()
        run: rm -f android/app/keystore.jks

      - name: "📋 Build summary"
        if: always()
        run: |
          echo "════════════════════════════════════════════════"
          echo "  KanMon GO — Build Summary"
          echo "  Target  : ${{ github.event_name == 'push' && 'apk-release' || github.event.inputs.build_target }}"
          echo "  Channel : ${{ github.event.inputs.flutter_channel || 'stable' }}"
          echo "  Run #   : ${{ github.run_number }}"
          echo "  Status  : ${{ job.status }}"
          echo "  llama   : ${{ steps.resolve-tag.outputs.llama_tag }}"
          echo "════════════════════════════════════════════════"
          ccache --show-stats 2>/dev/null || true

# ══════════════════════════════════════════════════════════════════════════════
  ios:
    name: "🍎 iOS Build"
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    if: github.event.inputs.build_target == 'ios'

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐦 Flutter (${{ github.event.inputs.flutter_channel || 'stable' }})"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: "🗑️ Remove sensitive files"
        run: |
          rm -f CLAUDE.md .env secrets.json
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -delete 2>/dev/null || true

      - name: "🔑 Install iOS certificate & provisioning"
        id: ios_sign
        env:
          IOS_CERTIFICATE_P12:   ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PWD:   ${{ secrets.IOS_CERTIFICATE_PWD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            KCHAIN="$RUNNER_TEMP/kf.keychain-db"
            KPWD="kf-ci-$(date +%s)"
            security create-keychain -p "$KPWD" "$KCHAIN"
            security set-keychain-settings -lut 21600 "$KCHAIN"
            security unlock-keychain -p "$KPWD" "$KCHAIN"
            security list-keychain -d user -s "$KCHAIN"
            echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPWD" "$KCHAIN" 2>/dev/null || true
            if [ -n "$IOS_PROVISION_PROFILE" ]; then
              PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
              mkdir -p "$PP_DIR"
              echo "$IOS_PROVISION_PROFILE" | base64 --decode > "$PP_DIR/kf.mobileprovision"
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "📦 Cache pub"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ios-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🍎 pod install"
        run: cd ios && pod install --repo-update

      - name: "🏗️ Build iOS — no codesign"
        if: steps.ios_sign.outputs.signed != 'true'
        run: flutter build ios --release --no-codesign --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}

      - name: "📤 Upload iOS (no-sign) → GitHub Release"
        if: steps.ios_sign.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/ios/iphoneos
          zip -r "KanMon GO-ios-nosign-v${{ github.run_number }}.zip" Runner.app
          TAG="gf-latest-ios-nosign"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "KanMon GO-ios-nosign-v${{ github.run_number }}.zip" \
            --title "KanMon GO iOS no-sign #${{ github.run_number }}" \
            --notes "iOS no-sign build #${{ github.run_number }}" \
            --prerelease

      - name: "🏗️ Build iOS IPA (signed)"
        if: steps.ios_sign.outputs.signed == 'true'
        run: |
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-ios" || true
          flutter build ipa --release $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}

      - name: "📤 Upload IPA → GitHub Release"
        if: steps.ios_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          FNAME="KanMon GO-v${{ github.run_number }}.ipa"
          cp "$IPA" "$FNAME"
          TAG="gf-latest-ios"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO iOS #${{ github.run_number }}" \
            --notes "iOS IPA build #${{ github.run_number }}"

      - name: "🗑️ Remove keychain"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kf.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
