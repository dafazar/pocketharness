# ══════════════════════════════════════════════════════════════════════════════
# KanMon GO — GitHub Actions Build Workflow (FIXED VERSION)
# ══════════════════════════════════════════════════════════════════════════════
# FIX: Corrected Node.js binary download to always use runner architecture (x64)
#      instead of incorrectly mapping Android target ABI to host tool architecture
# ══════════════════════════════════════════════════════════════════════════════
name: 🚀 Build KanMon GO

"on":
  workflow_dispatch:
    inputs:
      build_target:
        description: "🎯 Pilih jenis build"
        required: true
        default: "apk-release-arm64"
        type: choice
        options:
          - apk-release-arm64
          - apk-release
          - apk-split-abi
          - apk-debug
          - aab
          - all-android
          - ios
      flutter_channel:
        description: "🐦 Flutter channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      enable_obfuscation:
        description: "🔒 Dart obfuscation (hanya release builds)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:

  android:
    name: "🤖 Android — ${{ github.event_name == 'push' && 'apk-release (auto push)' || github.event.inputs.build_target }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90

    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_target == 'apk-release'      ||
      github.event.inputs.build_target == 'apk-release-arm64'||
      github.event.inputs.build_target == 'apk-split-abi'    ||
      github.event.inputs.build_target == 'apk-debug'        ||
      github.event.inputs.build_target == 'aab'               ||
      github.event.inputs.build_target == 'all-android'

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
      TAR_OPTIONS: "--no-same-permissions"

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "💾 Cache Android SDK platforms"
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-platforms-36-35-34

      - name: "📱 Install Android SDK platforms"
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_SDK_ROOT" 2>&1 | grep -E "^(Downloading|Installing|done|License)" || true

      - name: "🐦 Flutter (${{ github.event.inputs.flutter_channel || 'stable' }})"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: "🐦 Flutter version"
        run: flutter --version

      - name: "🗑️ Remove sensitive files"
        run: |
          rm -f CLAUDE.md AUDIT_REPORT.md
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -delete 2>/dev/null || true
          rm -f .env .env.local secrets.json keys.json

      - name: "📦 Cache pub"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: android-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: android-pub-${{ runner.os }}-

      - name: "📦 flutter pub get"
        run: flutter pub get

      # ── SESSION_01: Bundle Node.js + Claude Code CLI + code-server ────────────

      - name: "💻 Resolve code-server version"
        id: resolve-codeserver
        run: |
          CS_VERSION=$(curl -sf https://registry.npmjs.org/code-server/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" 2>/dev/null || echo "")
          if [ -z "$CS_VERSION" ]; then
            CS_VERSION="4.93.1"
          fi
          echo "  📌 code-server version: $CS_VERSION"
          echo "cs_version=$CS_VERSION" >> "$GITHUB_OUTPUT"

      - name: "🟢 Resolve Node.js LTS version"
        id: resolve-nodejs
        run: |
          # Claude Code CLI requires Node.js v20 — do NOT use v22
          NODE_VERSION=$(curl -sf https://nodejs.org/dist/index.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); lts=[v for v in d if v.get('lts') and v['version'].startswith('v20')]; print(lts[0]['version'].lstrip('v'))" \
            2>/dev/null || echo "20.19.1")
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "  📌 Node.js: $NODE_VERSION"

      - name: "🔍 Determine ABIs for build target"
        id: abis
        run: |
          TARGET="${{ github.event.inputs.build_target }}"
          case "$TARGET" in
            apk-release-arm64|apk-debug)
              ABIS="arm64-v8a"
              ;;
            apk-split-abi|all-android|apk-release)
              ABIS="arm64-v8a x86_64"
              ;;
            aab)
              ABIS="arm64-v8a"
              ;;
            *)
              ABIS="arm64-v8a"
              ;;
          esac
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "  📌 ABIs to bundle: $ABIS"

      - name: "💾 Cache bundled tools"
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: assets/tools
          key: tools-bundle-node${{ steps.resolve-nodejs.outputs.node_version }}-cs${{ steps.resolve-codeserver.outputs.cs_version }}-${{ runner.os }}-${{ runner.arch }}

      - name: "📁 Ensure assets/tools directory exists"
        run: |
          mkdir -p assets/tools
          echo "  📁 assets/tools dir ready (cache-hit: ${{ steps.cache-tools.outputs.cache-hit }})"

      - name: "📦 Bundle Node.js (Termux/Bionic) + Claude Code + CLI tools"
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NODE_VERSION="${{ steps.resolve-nodejs.outputs.node_version }}"
          ABIS="${{ steps.abis.outputs.abis }}"
          TOOLS_DIR="assets/tools"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TERMUX_POOL="https://packages.termux.dev/apt/termux-main/pool/main"

          sudo apt-get install -y binutils -qq

          mkdir -p "$TOOLS_DIR"

          # ── Host Node.js (Linux x64) — used only for npm install ─────────
          HOST_NODE=$(which node)
          HOST_NPM=$(which npm || echo "$(dirname $HOST_NODE)/npm")
          echo "  🟢 Host Node: $($HOST_NODE --version)  NPM: $($HOST_NPM --version)"

          CLAUDE_CODE_VERSION="unknown"

          for ABI in $ABIS; do
            echo ""
            echo "  ══ ABI: $ABI ══════════════════════════════════════════════════"
            mkdir -p "$TOOLS_DIR/$ABI/npm_modules/@anthropic-ai"
            mkdir -p "$TOOLS_DIR/$ABI/bin"

            case "$ABI" in
              arm64-v8a) TERMUX_ARCH="aarch64" ;;
              x86_64)    TERMUX_ARCH="x86_64"  ;;
              *)         TERMUX_ARCH="aarch64" ;;
            esac

            # ── Android-native Node.js (Termux/Bionic libc) ──────────────────
            echo "    ⬇️  Android Node.js from Termux ($TERMUX_ARCH)..."
            NODE_DEB_NAME=$(curl -sf "${TERMUX_POOL}/n/nodejs-lts/" \
              | grep -oP 'href="\K[^"]*'"${TERMUX_ARCH}"'[^"]*\.deb' \
              | grep -v 'dbgsym\|dev\|doc' \
              | head -1)
            if [ -n "$NODE_DEB_NAME" ]; then
              curl -fsSL "${TERMUX_POOL}/n/nodejs-lts/${NODE_DEB_NAME}" -o "/tmp/nodejs_${TERMUX_ARCH}.deb"
              mkdir -p "/tmp/deb_node"
              cd "/tmp/deb_node"
              ar x "/tmp/nodejs_${TERMUX_ARCH}.deb"
              DATA_TAR=$(ls data.tar.* 2>/dev/null | head -1)
              if [ -n "$DATA_TAR" ]; then
                tar -xf "$DATA_TAR" 2>/dev/null || true
                ANDROID_NODE=$(find . -type f -name "node" | grep "usr/bin" | head -1)
                if [ -n "$ANDROID_NODE" ]; then
                  cp "$ANDROID_NODE" "$OLDPWD/$TOOLS_DIR/$ABI/node"
                  chmod 755 "$OLDPWD/$TOOLS_DIR/$ABI/node"
                  echo "    ✅ Android Node.js (Bionic, $TERMUX_ARCH)"
                else
                  echo "    ⚠️  node binary not found in deb — using host binary (emulator only)"
                  cp "$HOST_NODE" "$OLDPWD/$TOOLS_DIR/$ABI/node"
                  chmod 755 "$OLDPWD/$TOOLS_DIR/$ABI/node"
                fi
              fi
              cd "$OLDPWD"
              rm -rf "/tmp/deb_node" "/tmp/nodejs_${TERMUX_ARCH}.deb"
            else
              echo "    ⚠️  Termux nodejs-lts deb not found — using host binary (emulator only)"
              cp "$HOST_NODE" "$TOOLS_DIR/$ABI/node"
              chmod 755 "$TOOLS_DIR/$ABI/node"
            fi

            # ── Claude Code CLI (pure JS, architecture-independent) ───────────
            CC_INSTALL="/tmp/cc_install_${ABI}"
            rm -rf "$CC_INSTALL" && mkdir -p "$CC_INSTALL"
            "$HOST_NODE" "$HOST_NPM" install \
              --prefix "$CC_INSTALL" --global \
              "@anthropic-ai/claude-code" \
              2>&1 | tail -3
            CLAUDE_CODE_VERSION=$("$HOST_NODE" -e \
              "try{const p=require('$CC_INSTALL/lib/node_modules/@anthropic-ai/claude-code/package.json');console.log(p.version);}catch(e){console.log('unknown');}" \
              2>/dev/null || echo "unknown")
            cp -r "$CC_INSTALL/lib/node_modules/@anthropic-ai/claude-code" \
              "$TOOLS_DIR/$ABI/npm_modules/@anthropic-ai/"
            rm -rf "$CC_INSTALL"
            echo "    ✅ Claude Code CLI: $CLAUDE_CODE_VERSION"

            # ── Termux CLI tools (git, ripgrep) ───────────────────────────────
            for PKG_INFO in "g/git/git" "r/ripgrep/ripgrep"; do
              PKG_LETTER=$(echo "$PKG_INFO" | cut -d/ -f1)
              PKG_DIR=$(echo "$PKG_INFO" | cut -d/ -f2)
              PKG_NAME=$(echo "$PKG_INFO" | cut -d/ -f3)
              DEB_NAME=$(curl -sf "${TERMUX_POOL}/${PKG_LETTER}/${PKG_DIR}/" \
                | grep -oP 'href="\K[^"]*'"${TERMUX_ARCH}"'[^"]*\.deb' \
                | grep -v 'dbgsym\|dev\|doc' | head -1)
              if [ -z "$DEB_NAME" ]; then
                echo "    ⚠️  $PKG_NAME: deb not found, skipping"
                continue
              fi
              curl -fsSL "${TERMUX_POOL}/${PKG_LETTER}/${PKG_DIR}/${DEB_NAME}" -o "/tmp/${PKG_NAME}.deb"
              mkdir -p "/tmp/deb_pkg"
              cd "/tmp/deb_pkg"
              ar x "/tmp/${PKG_NAME}.deb"
              DATA_TAR=$(ls data.tar.* 2>/dev/null | head -1)
              if [ -n "$DATA_TAR" ]; then
                tar -xf "$DATA_TAR" 2>/dev/null || true
                BIN_PATH=$(find . -path "*/usr/bin/$PKG_NAME" -type f | head -1)
                if [ -n "$BIN_PATH" ]; then
                  cp "$BIN_PATH" "$OLDPWD/$TOOLS_DIR/$ABI/bin/$PKG_NAME"
                  chmod 755 "$OLDPWD/$TOOLS_DIR/$ABI/bin/$PKG_NAME"
                  echo "    ✅ $PKG_NAME bundled"
                fi
              fi
              cd "$OLDPWD"
              rm -rf "/tmp/deb_pkg" "/tmp/${PKG_NAME}.deb"
            done

            # ── Launcher script ───────────────────────────────────────────────
            mkdir -p "$TOOLS_DIR/$ABI/launcher"
            printf '%s\n' \
              '#!/bin/sh' \
              'TOOLS="$(dirname "$(dirname "$0")")" ' \
              'export NODE_PATH="$TOOLS/npm_modules"' \
              'export NODE_NO_WARNINGS=1' \
              'export CLAUDE_CODE_DISABLE_TELEMETRY=1' \
              'exec "$TOOLS/node" "$TOOLS/npm_modules/@anthropic-ai/claude-code/cli.js" "$@"' \
              > "$TOOLS_DIR/$ABI/launcher/claude_code_launcher.sh"
            chmod 755 "$TOOLS_DIR/$ABI/launcher/claude_code_launcher.sh"

            # ── Pack per-ABI tarball ──────────────────────────────────────────
            echo "    📦 Creating tools_${ABI}.tar.gz ..."
            tar -czf "$TOOLS_DIR/tools_${ABI}.tar.gz" \
              -C "$TOOLS_DIR" \
              "$ABI"
            TARBALL_SIZE=$(du -sh "$TOOLS_DIR/tools_${ABI}.tar.gz" | cut -f1)
            echo "    ✅ tools_${ABI}.tar.gz  ($TARBALL_SIZE)"

            # Clean up unpacked dir
            rm -rf "$TOOLS_DIR/$ABI"
          done

          # ── Generate tools_manifest.json ──────────────────────────────────
          ABIS_JSON=$(echo "$ABIS" | tr ' ' '\n' | \
            python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          python3 << PYEOF2
          import json
          manifest = {
              "schema_version": 2,
              "built_at": "${BUILD_DATE}",
              "run_id": "${{ github.run_id }}",
              "node_version": "${NODE_VERSION}",
              "claude_code_version": "${CLAUDE_CODE_VERSION}",
              "code_server_version": "not_bundled",
              "abis": ${ABIS_JSON},
              "tools": ["claude-code", "git", "ripgrep"]
          }
          with open("${TOOLS_DIR}/tools_manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("  ✅ tools_manifest.json generated")
          PYEOF2

          echo ""
          echo "  ✅ Bundle complete:"
          ls -lh "$TOOLS_DIR/"

      # ── Verify tools bundle before build ─────────────────────────────────

      - name: "✅ Verify tools bundle integrity"
        run: |
          TOOLS_DIR="assets/tools"
          echo "  🔍 Verifying tools bundle..."
          echo "  Cache hit: ${{ steps.cache-tools.outputs.cache-hit }}"
          echo "  Contents of $TOOLS_DIR:"
          ls -lh "$TOOLS_DIR/" 2>/dev/null || echo "  (empty or not found)"

          # Wajib ada tools_manifest.json
          if [ ! -f "$TOOLS_DIR/tools_manifest.json" ]; then
            echo ""
            echo "  ❌ FATAL: tools_manifest.json NOT found in $TOOLS_DIR/"
            echo "  Cache hit was: ${{ steps.cache-tools.outputs.cache-hit }}"
            echo "  This means the bundle step was skipped (cache hit) but cache restore failed,"
            echo "  OR the bundle step itself failed silently."
            echo ""
            echo "  → Fix: Delete the Actions cache named 'tools-bundle-*' in repo settings"
            echo "    and re-run this workflow to force a fresh bundle."
            exit 1
          fi

          # Cek tarball ABI sesuai target
          ABIS="${{ steps.abis.outputs.abis }}"
          for ABI in $ABIS; do
            TARBALL="$TOOLS_DIR/tools_${ABI}.tar.gz"
            if [ ! -f "$TARBALL" ]; then
              echo "  ❌ FATAL: $TARBALL NOT found!"
              exit 1
            fi
            SIZE=$(du -sh "$TARBALL" | cut -f1)
            echo "  ✅ $TARBALL ($SIZE)"
          done

          echo "  ✅ tools_manifest.json found"
          cat "$TOOLS_DIR/tools_manifest.json"
          echo ""
          echo "  ✅ All tools verified — proceeding to Flutter build."

      # ── SESSION_02: Build Flutter APK ─────────────────────────────────────

      - name: "📌 Resolve llama.cpp tag"
        id: resolve-tag
        run: |
          curl -sf https://api.github.com/repos/ggerganov/llama.cpp/releases \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['tag_name'])" > /tmp/llama_tag 2>/dev/null || echo "b3965" > /tmp/llama_tag
          LLAMA_TAG=$(cat /tmp/llama_tag)
          echo "llama_tag=$LLAMA_TAG" >> "$GITHUB_OUTPUT"
          echo "  📌 llama.cpp: $LLAMA_TAG"

      - name: "🏗️ Build APK arm64 (release)"
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'apk-release-arm64'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-arm64" || true
          flutter build apk --release --target-platform=android-arm64 $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)  app-release.apk"

      - name: "📤 Upload arm64 APK → GitHub Release"
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'apk-release-arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FNAME="KanMon GO-arm64-v${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-release.apk" "$FNAME"
          TAG="gf-latest-arm64"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO arm64 #${{ github.run_number }}" \
            --notes "arm64 release build #${{ github.run_number }}"

      - name: "✂️ Build APK Split per ABI"
        if: |
          github.event.inputs.build_target == 'apk-split-abi' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-split" || true
          flutter build apk --release --split-per-abi $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}

      - name: "📤 Upload Split APKs → GitHub Release"
        if: |
          github.event.inputs.build_target == 'apk-split-abi' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "KanMon GO-arm64-v${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-x86_64-release.apk"    "KanMon GO-x86_64-v${{ github.run_number }}.apk"
          TAG="gf-latest-split"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "KanMon GO-arm64-v${{ github.run_number }}.apk" \
            "KanMon GO-x86_64-v${{ github.run_number }}.apk" \
            --title "KanMon GO Split APK #${{ github.run_number }}" \
            --notes "Split per ABI build #${{ github.run_number }}"

      - name: "📦 Build AAB"
        if: |
          github.event.inputs.build_target == 'aab' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-aab" || true
          flutter build appbundle --release $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1)  app-release.aab"

      - name: "📤 Upload AAB → GitHub Release"
        if: |
          github.event.inputs.build_target == 'aab' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FNAME="KanMon GO-playstore-v${{ github.run_number }}.aab"
          cp "build/app/outputs/bundle/release/app-release.aab" "$FNAME"
          TAG="gf-latest-aab"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO AAB #${{ github.run_number }}" \
            --notes "AAB Play Store build #${{ github.run_number }}"

      - name: "🗑️ Remove keystore"
        if: always()
        run: rm -f android/app/keystore.jks

      - name: "📋 Build summary"
        if: always()
        run: |
          echo "════════════════════════════════════════════════"
          echo "  KanMon GO — Build Summary"
          echo "  Target  : ${{ github.event_name == 'push' && 'apk-release' || github.event.inputs.build_target }}"
          echo "  Channel : ${{ github.event.inputs.flutter_channel || 'stable' }}"
          echo "  Run #   : ${{ github.run_number }}"
          echo "  Status  : ${{ job.status }}"
          echo "  llama   : ${{ steps.resolve-tag.outputs.llama_tag }}"
          echo "════════════════════════════════════════════════"
          ccache --show-stats 2>/dev/null || true

# ══════════════════════════════════════════════════════════════════════════════
  ios:
    name: "🍎 iOS Build"
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    if: github.event.inputs.build_target == 'ios'

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐦 Flutter (${{ github.event.inputs.flutter_channel || 'stable' }})"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: "🗑️ Remove sensitive files"
        run: |
          rm -f CLAUDE.md .env secrets.json
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -delete 2>/dev/null || true

      - name: "🔑 Install iOS certificate & provisioning"
        id: ios_sign
        env:
          IOS_CERTIFICATE_P12:   ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PWD:   ${{ secrets.IOS_CERTIFICATE_PWD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            KCHAIN="$RUNNER_TEMP/kf.keychain-db"
            KPWD="kf-ci-$(date +%s)"
            security create-keychain -p "$KPWD" "$KCHAIN"
            security set-keychain-settings -lut 21600 "$KCHAIN"
            security unlock-keychain -p "$KPWD" "$KCHAIN"
            security list-keychain -d user -s "$KCHAIN"
            echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPWD" "$KCHAIN" 2>/dev/null || true
            if [ -n "$IOS_PROVISION_PROFILE" ]; then
              PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
              mkdir -p "$PP_DIR"
              echo "$IOS_PROVISION_PROFILE" | base64 --decode > "$PP_DIR/kf.mobileprovision"
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "📦 Cache pub"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ios-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🍎 pod install"
        run: cd ios && pod install --repo-update

      - name: "🏗️ Build iOS — no codesign"
        if: steps.ios_sign.outputs.signed != 'true'
        run: flutter build ios --release --no-codesign --dart-define=CODE_SERVER_VERSION=4.93.1

      - name: "📤 Upload iOS (no-sign) → GitHub Release"
        if: steps.ios_sign.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/ios/iphoneos
          zip -r "KanMon GO-ios-nosign-v${{ github.run_number }}.zip" Runner.app
          TAG="gf-latest-ios-nosign"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "KanMon GO-ios-nosign-v${{ github.run_number }}.zip" \
            --title "KanMon GO iOS no-sign #${{ github.run_number }}" \
            --notes "iOS no-sign build #${{ github.run_number }}" \
            --prerelease

      - name: "🏗️ Build iOS IPA (signed)"
        if: steps.ios_sign.outputs.signed == 'true'
        run: |
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-ios" || true
          flutter build ipa --release $OBFSTR --dart-define=CODE_SERVER_VERSION=4.93.1

      - name: "📤 Upload IPA → GitHub Release"
        if: steps.ios_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          FNAME="KanMon GO-v${{ github.run_number }}.ipa"
          cp "$IPA" "$FNAME"
          TAG="gf-latest-ios"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO iOS #${{ github.run_number }}" \
            --notes "iOS IPA build #${{ github.run_number }}"

      - name: "🗑️ Remove keychain"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kf.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
