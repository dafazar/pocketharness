# ══════════════════════════════════════════════════════════════════════════════
# KanMon GO — GitHub Actions Build Workflow (FIXED VERSION)
# ══════════════════════════════════════════════════════════════════════════════
# FIX: Corrected Node.js binary download to always use runner architecture (x64)
#      instead of incorrectly mapping Android target ABI to host tool architecture
# ══════════════════════════════════════════════════════════════════════════════
name: 🚀 Build KanMon GO

"on":
  workflow_dispatch:
    inputs:
      build_target:
        description: "🎯 Pilih jenis build"
        required: true
        default: "apk-release-arm64"
        type: choice
        options:
          - apk-release-arm64
          - apk-release
          - apk-split-abi
          - apk-debug
          - aab
          - all-android
          - ios
      flutter_channel:
        description: "🐦 Flutter channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
      enable_obfuscation:
        description: "🔒 Dart obfuscation (hanya release builds)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:

  android:
    name: "🤖 Android — ${{ github.event_name == 'push' && 'apk-release (auto push)' || github.event.inputs.build_target }}"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 120

    if: |
      github.event_name == 'push' ||
      github.event.inputs.build_target == 'apk-release'      ||
      github.event.inputs.build_target == 'apk-release-arm64'||
      github.event.inputs.build_target == 'apk-split-abi'    ||
      github.event.inputs.build_target == 'apk-debug'        ||
      github.event.inputs.build_target == 'aab'               ||
      github.event.inputs.build_target == 'all-android'

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
      TAR_OPTIONS: "--no-same-permissions"

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "☕ Java 17"
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: "📱 Setup Android SDK"
        uses: android-actions/setup-android@v3

      - name: "💾 Cache Android SDK platforms"
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-platforms-36-35-34

      - name: "📱 Install Android SDK platforms"
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            --sdk_root="$ANDROID_SDK_ROOT" 2>&1 | grep -E "^(Downloading|Installing|done|License)" || true

      - name: "🐦 Flutter (${{ github.event.inputs.flutter_channel || 'stable' }})"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: "🐦 Flutter version"
        run: flutter --version

      - name: "🗑️ Remove sensitive files"
        run: |
          rm -f CLAUDE.md AUDIT_REPORT.md
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -delete 2>/dev/null || true
          rm -f .env .env.local secrets.json keys.json

      - name: "📦 Cache pub"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: android-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: android-pub-${{ runner.os }}-

      - name: "📦 flutter pub get"
        run: flutter pub get

      # ── SESSION_01: Bundle Node.js + Claude Code CLI + code-server ────────────

      - name: "💻 Resolve code-server version"
        id: resolve-codeserver
        run: |
          # code-server >= 4.100.0 requires Node.js v22+.
          # Our Android Termux Node.js is v20 — must stay on last v20-compatible release.
          # MAX_COMPATIBLE: last code-server version confirmed to work with Node v20.
          MAX_COMPATIBLE="4.96.2"
          CS_VERSION=$(curl -sf https://registry.npmjs.org/code-server \
            | python3 -c "import sys,json; d=json.load(sys.stdin); vs=list(d.get('versions',{}).keys()); vt=lambda v: tuple(int(x) for x in v.split('.')) if all(x.isdigit() for x in v.split('.')) else (0,); mx=vt('${MAX_COMPATIBLE}'); ok=sorted([v for v in vs if vt(v)<=mx],key=vt,reverse=True); print(ok[0] if ok else '${MAX_COMPATIBLE}')" \
            2>/dev/null || echo "$MAX_COMPATIBLE")
          echo "  📌 code-server version: $CS_VERSION (max Node-v20-compatible: $MAX_COMPATIBLE)"
          echo "cs_version=$CS_VERSION" >> "$GITHUB_OUTPUT"

      - name: "🟢 Resolve Node.js LTS version"
        id: resolve-nodejs
        run: |
          # Claude Code CLI requires Node.js v20 — do NOT use v22
          NODE_VERSION=$(curl -sf https://nodejs.org/dist/index.json \
            | python3 -c "import sys,json; d=json.load(sys.stdin); lts=[v for v in d if v.get('lts') and v['version'].startswith('v20')]; print(lts[0]['version'].lstrip('v'))" \
            2>/dev/null || echo "20.19.1")
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "  📌 Node.js: $NODE_VERSION"

      - name: "🔍 Determine ABIs for build target"
        id: abis
        run: |
          TARGET="${{ github.event.inputs.build_target }}"
          case "$TARGET" in
            apk-release-arm64|apk-debug)
              ABIS="arm64-v8a"
              ;;
            apk-split-abi|all-android|apk-release)
              ABIS="arm64-v8a x86_64"
              ;;
            aab)
              ABIS="arm64-v8a"
              ;;
            *)
              ABIS="arm64-v8a"
              ;;
          esac
          echo "abis=$ABIS" >> "$GITHUB_OUTPUT"
          echo "  📌 ABIs to bundle: $ABIS"

      - name: "💾 Cache bundled tools"
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: assets/tools
          key: tools-bundle-v5-node${{ steps.resolve-nodejs.outputs.node_version }}-cs${{ steps.resolve-codeserver.outputs.cs_version }}-${{ runner.os }}-${{ runner.arch }}

      - name: "📁 Ensure assets/tools directory exists"
        run: |
          mkdir -p assets/tools
          echo "  📁 assets/tools dir ready (cache-hit: ${{ steps.cache-tools.outputs.cache-hit }})"

      - name: "🔍 Validate cache integrity"
        id: validate-cache
        run: |
          TOOLS_DIR="assets/tools"
          if [ "${{ steps.cache-tools.outputs.cache-hit }}" == "true" ] && [ ! -f "$TOOLS_DIR/tools_manifest.json" ]; then
            echo "  ⚠️  Cache hit but tools_manifest.json is MISSING — forcing rebuild"
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "  ✅ Cache state OK"
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "📦 Bundle Node.js (Termux/Bionic) + Claude Code + CLI tools"
        id: bundle-node-tools
        if: steps.cache-tools.outputs.cache-hit != 'true' || steps.validate-cache.outputs.needs_rebuild == 'true'
        run: |
          set -euo pipefail
          NODE_VERSION="${{ steps.resolve-nodejs.outputs.node_version }}"
          ABIS="${{ steps.abis.outputs.abis }}"
          TOOLS_DIR="assets/tools"
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          TERMUX_POOL="https://packages.termux.dev/apt/termux-main/pool/main"

          sudo apt-get install -y binutils -qq

          mkdir -p "$TOOLS_DIR"

          # ── Host Node.js (Linux x64) — used only for npm install ─────────
          HOST_NODE=$(which node)
          HOST_NPM=$(which npm || echo "$(dirname $HOST_NODE)/npm")
          echo "  🟢 Host Node: $($HOST_NODE --version)  NPM: $($HOST_NPM --version)"

          CLAUDE_CODE_VERSION="unknown"

          for ABI in $ABIS; do
            echo ""
            echo "  ══ ABI: $ABI ══════════════════════════════════════════════════"
            mkdir -p "$TOOLS_DIR/$ABI/npm_modules/@anthropic-ai"
            mkdir -p "$TOOLS_DIR/$ABI/npm_modules/code-server"
            mkdir -p "$TOOLS_DIR/$ABI/bin"

            case "$ABI" in
              arm64-v8a) TERMUX_ARCH="aarch64" ;;
              x86_64)    TERMUX_ARCH="x86_64"  ;;
              *)         TERMUX_ARCH="aarch64" ;;
            esac

            # ── Android-native Node.js (Termux/Bionic libc) ──────────────────
            echo "    ⬇️  Android Node.js from Termux ($TERMUX_ARCH)..."
            NODE_DEB_NAME=$(curl -sf "${TERMUX_POOL}/n/nodejs-lts/" \
              | grep -oP 'href="\K[^"]*'"${TERMUX_ARCH}"'[^"]*\.deb' \
              | grep -v 'dbgsym\|dev\|doc' \
              | head -1)
            if [ -n "$NODE_DEB_NAME" ]; then
              curl -fsSL "${TERMUX_POOL}/n/nodejs-lts/${NODE_DEB_NAME}" -o "/tmp/nodejs_${TERMUX_ARCH}.deb"
              mkdir -p "/tmp/deb_node"
              cd "/tmp/deb_node"
              ar x "/tmp/nodejs_${TERMUX_ARCH}.deb"
              DATA_TAR=$(ls data.tar.* 2>/dev/null | head -1)
              if [ -n "$DATA_TAR" ]; then
                tar -xf "$DATA_TAR" 2>/dev/null || true
                ANDROID_NODE=$(find . -type f -name "node" | grep "usr/bin" | head -1)
                if [ -n "$ANDROID_NODE" ]; then
                  cp "$ANDROID_NODE" "$OLDPWD/$TOOLS_DIR/$ABI/node"
                  chmod 755 "$OLDPWD/$TOOLS_DIR/$ABI/node"
                  echo "    ✅ Android Node.js (Bionic, $TERMUX_ARCH)"
                else
                  echo "    ⚠️  node binary not found in deb — using host binary (emulator only)"
                  cp "$HOST_NODE" "$OLDPWD/$TOOLS_DIR/$ABI/node"
                  chmod 755 "$OLDPWD/$TOOLS_DIR/$ABI/node"
                fi
              fi
              cd "$OLDPWD"
              rm -rf "/tmp/deb_node" "/tmp/nodejs_${TERMUX_ARCH}.deb"
            else
              echo "    ⚠️  Termux nodejs-lts deb not found — using host binary (emulator only)"
              cp "$HOST_NODE" "$TOOLS_DIR/$ABI/node"
              chmod 755 "$TOOLS_DIR/$ABI/node"
            fi

            # ── Claude Code CLI (pure JS, architecture-independent) ───────────
            CC_INSTALL="/tmp/cc_install_${ABI}"
            rm -rf "$CC_INSTALL" && mkdir -p "$CC_INSTALL"
            "$HOST_NODE" "$HOST_NPM" install \
              --prefix "$CC_INSTALL" --global \
              "@anthropic-ai/claude-code" \
              2>&1 | tail -3
            CLAUDE_CODE_VERSION=$("$HOST_NODE" -e \
              "try{const p=require('$CC_INSTALL/lib/node_modules/@anthropic-ai/claude-code/package.json');console.log(p.version);}catch(e){console.log('unknown');}" \
              2>/dev/null || echo "unknown")
            cp -r "$CC_INSTALL/lib/node_modules/@anthropic-ai/claude-code" \
              "$TOOLS_DIR/$ABI/npm_modules/@anthropic-ai/"
            rm -rf "$CC_INSTALL"
            echo "    ✅ Claude Code CLI: $CLAUDE_CODE_VERSION"

            # ── code-server (VS Code in browser) — pure JS, arch-independent ──
            CS_VERSION_ACTUAL="${{ steps.resolve-codeserver.outputs.cs_version }}"
            echo "    ⬇️  code-server v${CS_VERSION_ACTUAL} (VS Code)..."
            CS_INSTALL="/tmp/cs_install_${ABI}"
            rm -rf "$CS_INSTALL" && mkdir -p "$CS_INSTALL"
            # Install code-server via npm (pure JS bundle, no native rebuild needed)
            # --ignore-scripts: skip postinstall that tries to cd into missing paths
            "$HOST_NODE" "$HOST_NPM" install \
              --prefix "$CS_INSTALL" --global \
              "code-server@${CS_VERSION_ACTUAL}" \
              --unsafe-perm \
              --ignore-scripts \
              2>&1 | tail -5
            # Verify install succeeded
            CS_ENTRY=$(find "$CS_INSTALL" -name "entry.js" -path "*/node/entry.js" 2>/dev/null | head -1)
            if [ -n "$CS_ENTRY" ]; then
              # Copy entire code-server module
              CS_MOD_DIR=$(dirname "$(dirname "$(dirname "$CS_ENTRY")")")
              cp -r "$CS_MOD_DIR" "$TOOLS_DIR/$ABI/npm_modules/code-server/"
              echo "    ✅ code-server v${CS_VERSION_ACTUAL} bundled ($(du -sh "$TOOLS_DIR/$ABI/npm_modules/code-server" | cut -f1))"
            else
              # Fallback: copy everything from lib/node_modules/code-server
              CS_LIB=$(find "$CS_INSTALL" -maxdepth 5 -type d -name "code-server" 2>/dev/null | head -1)
              if [ -n "$CS_LIB" ]; then
                cp -r "$CS_LIB/." "$TOOLS_DIR/$ABI/npm_modules/code-server/"
                echo "    ✅ code-server v${CS_VERSION_ACTUAL} bundled (fallback path)"
              else
                echo "    ⚠️  code-server: module not found after install — check npm logs"
                ls "$CS_INSTALL/lib/node_modules/" 2>/dev/null || true
              fi
            fi
            rm -rf "$CS_INSTALL"

            # ── Launcher script: code-server ──────────────────────────────────

            # ════════════════════════════════════════════════════════════════
            # ── Native CLI Tools from Termux (Android Bionic libc) ──────────
            # ════════════════════════════════════════════════════════════════
            echo "    📦 Bundling native CLI tools from Termux ($TERMUX_ARCH)..."

            BIN_DEST="$TOOLS_DIR/$ABI/bin"
            mkdir -p "$BIN_DEST"

            # Helper: download & extract single binary from Termux deb
            # Uses basename matching so it works regardless of Termux prefix path
            # (e.g. ./data/data/com.termux/files/usr/bin/git OR ./usr/bin/git)
            extract_termux_bin() {
              local POOL_L="$1" PKG_DIR="$2" PKG_NAME="$3" BIN_SUBPATH="$4" DEST="$5" T_ARCH="$6"
              local BIN_BASENAME
              BIN_BASENAME=$(basename "$BIN_SUBPATH")
              # Resolve DEST to absolute path BEFORE any cd, so cp works correctly regardless of cwd
              local ABS_DEST
              ABS_DEST="$(cd "$(dirname "$DEST")" 2>/dev/null && pwd)/$(basename "$DEST")" || \
                ABS_DEST="$(pwd)/$DEST"
              local DEB_NAME
              DEB_NAME=$(curl -sf "${TERMUX_POOL}/${POOL_L}/${PKG_DIR}/" \
                | grep -oP 'href="\K[^"]*'"${T_ARCH}"'[^"]*\.deb' \
                | grep -v 'dbgsym\|dev\|doc' | head -1 || true)
              if [ -z "$DEB_NAME" ]; then
                echo "      ⚠️  $PKG_NAME not found for $T_ARCH, skipping"
                return 1
              fi
              curl -fsSL "${TERMUX_POOL}/${POOL_L}/${PKG_DIR}/${DEB_NAME}" -o "/tmp/${PKG_NAME}_${T_ARCH}.deb"
              local EXDIR="/tmp/deb_${PKG_NAME}_${T_ARCH}"
              rm -rf "$EXDIR" && mkdir -p "$EXDIR"
              pushd "$EXDIR" > /dev/null
              ar x "/tmp/${PKG_NAME}_${T_ARCH}.deb"
              local DATA_TAR
              DATA_TAR=$(ls data.tar.* 2>/dev/null | head -1)
              local FOUND=0
              if [ -n "$DATA_TAR" ]; then
                tar -xf "$DATA_TAR" 2>/dev/null || true
                local BIN_PATH
                # Try exact subpath first, then basename fallback (handles different Termux prefix layouts)
                BIN_PATH=$(find . -path "*/${BIN_SUBPATH}" -type f 2>/dev/null | head -1)
                if [ -z "$BIN_PATH" ]; then
                  BIN_PATH=$(find . -name "${BIN_BASENAME}" -type f 2>/dev/null \
                    | grep -v 'dbgsym\|include\|share/man\|\.h$' | head -1)
                fi
                if [ -n "$BIN_PATH" ]; then
                  mkdir -p "$(dirname "$ABS_DEST")"
                  cp "$BIN_PATH" "$ABS_DEST"
                  chmod 755 "$ABS_DEST"
                  echo "      ✅ $PKG_NAME bundled"
                  FOUND=1
                else
                  echo "      ⚠️  ${BIN_BASENAME} not found in $PKG_NAME deb"
                fi
              fi
              popd > /dev/null
              rm -rf "$EXDIR" "/tmp/${PKG_NAME}_${T_ARCH}.deb"
              return $((1 - FOUND))
            }

            # ── git ──────────────────────────────────────────────────────────
            extract_termux_bin "g" "git" "git" "usr/bin/git" "$BIN_DEST/git" "$TERMUX_ARCH" || true

            # ── ripgrep ──────────────────────────────────────────────────────
            extract_termux_bin "r" "ripgrep" "ripgrep" "usr/bin/rg" "$BIN_DEST/rg" "$TERMUX_ARCH"

            # ── curl ─────────────────────────────────────────────────────────
            extract_termux_bin "c" "curl" "curl" "usr/bin/curl" "$BIN_DEST/curl" "$TERMUX_ARCH"

            # ── wget ─────────────────────────────────────────────────────────
            extract_termux_bin "w" "wget" "wget" "usr/bin/wget" "$BIN_DEST/wget" "$TERMUX_ARCH"

            # ── jq ───────────────────────────────────────────────────────────
            extract_termux_bin "j" "jq" "jq" "usr/bin/jq" "$BIN_DEST/jq" "$TERMUX_ARCH"

            # ── busybox (sh, grep, sed, awk, find, tar, …) ───────────────────
            extract_termux_bin "b" "busybox" "busybox" "usr/bin/busybox" "$BIN_DEST/busybox" "$TERMUX_ARCH"
            if [ -f "$BIN_DEST/busybox" ]; then
              for APPLET in sh ash grep sed awk find xargs head tail wc sort uniq tr cut paste \
                            tar gzip gunzip bzip2 bunzip2 xz unxz base64 \
                            du df free top ps kill killall sleep date echo printf \
                            mkdir rm cp mv ln touch chmod chown stat readlink \
                            od hexdump strings md5sum sha256sum sha1sum \
                            nc netstat cmp diff patch vi; do
                if [ ! -f "$BIN_DEST/$APPLET" ]; then
                  ln -sf busybox "$BIN_DEST/$APPLET"
                fi
              done
              echo "      ✅ busybox applet symlinks created"
            fi

            # ── python3 ──────────────────────────────────────────────────────
            # Termux package dir is python3 (not python)
            extract_termux_bin "p" "python3" "python3" "usr/bin/python3" "$BIN_DEST/python3" "$TERMUX_ARCH" || \
              extract_termux_bin "p" "python" "python3" "usr/bin/python3" "$BIN_DEST/python3" "$TERMUX_ARCH" || true
            if [ -f "$BIN_DEST/python3" ] && [ ! -f "$BIN_DEST/python" ]; then
              ln -sf python3 "$BIN_DEST/python"
            fi

            # ── zip / unzip ──────────────────────────────────────────────────
            extract_termux_bin "z" "zip" "zip" "usr/bin/zip" "$BIN_DEST/zip" "$TERMUX_ARCH"
            extract_termux_bin "u" "unzip" "unzip" "usr/bin/unzip" "$BIN_DEST/unzip" "$TERMUX_ARCH"

            # ── sqlite3 ──────────────────────────────────────────────────────
            extract_termux_bin "s" "sqlite" "sqlite" "usr/bin/sqlite3" "$BIN_DEST/sqlite3" "$TERMUX_ARCH"

            # ── ffmpeg + ffprobe ──────────────────────────────────────────────
            extract_termux_bin "f" "ffmpeg" "ffmpeg" "usr/bin/ffmpeg" "$BIN_DEST/ffmpeg" "$TERMUX_ARCH"
            extract_termux_bin "f" "ffmpeg" "ffprobe" "usr/bin/ffprobe" "$BIN_DEST/ffprobe" "$TERMUX_ARCH"

            # ── imagemagick (convert, identify, mogrify) ─────────────────────
            # All binaries are in the single 'imagemagick' package
            extract_termux_bin "i" "imagemagick" "imagemagick" "usr/bin/convert" "$BIN_DEST/convert" "$TERMUX_ARCH" || true
            if [ -f "$BIN_DEST/convert" ]; then
              # identify and mogrify are also in the same deb — extract directly
              _IM_EXDIR="/tmp/deb_im_reuse_${TERMUX_ARCH}"
              _IM_DEB_NAME=$(curl -sf "${TERMUX_POOL}/i/imagemagick/" \
                | grep -oP 'href="\K[^"]*'"${TERMUX_ARCH}"'[^"]*\.deb' \
                | grep -v 'dbgsym\|dev\|doc' | head -1 || true)
              if [ -n "$_IM_DEB_NAME" ]; then
                curl -fsSL "${TERMUX_POOL}/i/imagemagick/${_IM_DEB_NAME}" -o "/tmp/im_${TERMUX_ARCH}.deb"
                rm -rf "$_IM_EXDIR" && mkdir -p "$_IM_EXDIR"
                cd "$_IM_EXDIR"
                ar x "/tmp/im_${TERMUX_ARCH}.deb"
                _IM_TAR=$(ls data.tar.* 2>/dev/null | head -1)
                if [ -n "$_IM_TAR" ]; then
                  tar -xf "$_IM_TAR" 2>/dev/null || true
                  for _BIN in identify mogrify magick; do
                    _BP=$(find . -name "$_BIN" -type f 2>/dev/null | grep -v 'man\|doc' | head -1)
                    if [ -n "$_BP" ]; then
                      cp "$_BP" "$OLDPWD/$BIN_DEST/$_BIN"
                      chmod 755 "$OLDPWD/$BIN_DEST/$_BIN"
                      echo "      ✅ imagemagick-${_BIN} bundled"
                    fi
                  done
                fi
                cd "$OLDPWD"
                rm -rf "$_IM_EXDIR" "/tmp/im_${TERMUX_ARCH}.deb"
              fi
            else
              echo "      ⚠️  imagemagick not available, skipping"
            fi
          done

          # Export CLAUDE_CODE_VERSION for use in subsequent steps
          echo "claude_code_version=${CLAUDE_CODE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: "📦 Bundle CLI tools (sox/yt-dlp/vim/exiftool/misc)"
        if: steps.cache-tools.outputs.cache-hit != 'true' || steps.validate-cache.outputs.needs_rebuild == 'true'
        env:
          TERMUX_POOL: "https://packages.termux.dev/apt/termux-main/pool/main"
        run: |
          set -euo pipefail
          ABIS="${{ steps.abis.outputs.abis }}"
          TOOLS_DIR="assets/tools"
          # Re-define variables from step 1 (each run: block is a separate shell)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NODE_VERSION="${{ steps.resolve-nodejs.outputs.node_version }}"
          CLAUDE_CODE_VERSION="${{ steps.bundle-node-tools.outputs.claude_code_version || 'unknown' }}"

          # Redefine extract_termux_bin helper (needed in split step)
          extract_termux_bin() {
            local POOL_L="$1" PKG_DIR="$2" PKG_NAME="$3" BIN_SUBPATH="$4" DEST="$5" T_ARCH="$6"
            local BIN_BASENAME
            BIN_BASENAME=$(basename "$BIN_SUBPATH")
            local ABS_DEST
            ABS_DEST="$(cd "$(dirname "$DEST")" 2>/dev/null && pwd)/$(basename "$DEST")" || \
              ABS_DEST="$(pwd)/$DEST"
            local DEB_NAME
            DEB_NAME=$(curl -sf "${TERMUX_POOL}/${POOL_L}/${PKG_DIR}/" \
              | grep -oP 'href="\K[^"]*'"${T_ARCH}"'[^"]*\.deb' \
              | grep -v 'dbgsym\|dev\|doc' | head -1 || true)
            if [ -z "$DEB_NAME" ]; then
              echo "      ⚠️  $PKG_NAME not found for $T_ARCH, skipping"
              return 1
            fi
            curl -fsSL "${TERMUX_POOL}/${POOL_L}/${PKG_DIR}/${DEB_NAME}" -o "/tmp/${PKG_NAME}_${T_ARCH}.deb"
            local EXDIR="/tmp/deb_${PKG_NAME}_${T_ARCH}"
            rm -rf "$EXDIR" && mkdir -p "$EXDIR"
            pushd "$EXDIR" > /dev/null
            ar x "/tmp/${PKG_NAME}_${T_ARCH}.deb"
            local DATA_TAR
            DATA_TAR=$(ls data.tar.* 2>/dev/null | head -1)
            local FOUND=0
            if [ -n "$DATA_TAR" ]; then
              tar -xf "$DATA_TAR" 2>/dev/null || true
              local BIN_PATH
              BIN_PATH=$(find . -path "*/${BIN_SUBPATH}" -type f 2>/dev/null | head -1)
              if [ -z "$BIN_PATH" ]; then
                BIN_PATH=$(find . -name "${BIN_BASENAME}" -type f 2>/dev/null \
                  | grep -v 'dbgsym\|include\|share/man\|\.h$' | head -1)
              fi
              if [ -n "$BIN_PATH" ]; then
                mkdir -p "$(dirname "$ABS_DEST")"
                cp "$BIN_PATH" "$ABS_DEST"
                chmod 755 "$ABS_DEST"
                echo "      ✅ $PKG_NAME bundled"
                FOUND=1
              else
                echo "      ⚠️  ${BIN_BASENAME} not found in $PKG_NAME deb"
              fi
            fi
            popd > /dev/null
            rm -rf "$EXDIR" "/tmp/${PKG_NAME}_${T_ARCH}.deb"
            return $((1 - FOUND))
          }

          for ABI in $ABIS; do
            echo ""
            echo "  ══ ABI: $ABI (CLI tools part 2) ══════════════════════════════"
            case "$ABI" in
              arm64-v8a) TERMUX_ARCH="aarch64" ;;
              x86_64)    TERMUX_ARCH="x86_64"  ;;
              *)         TERMUX_ARCH="aarch64" ;;
            esac
            BIN_DEST="assets/tools/$ABI/bin"
            mkdir -p "$BIN_DEST"

            # ── sox + soxi ───────────────────────────────────────────────────
            # Both sox and soxi binaries are in the main 'sox' package
            extract_termux_bin "s" "sox" "sox" "usr/bin/sox" "$BIN_DEST/sox" "$TERMUX_ARCH" || true
            if [ ! -f "$BIN_DEST/soxi" ] && [ -f "$BIN_DEST/sox" ]; then
              # soxi is also in the same sox deb — re-extract
              _SOX_DEB=$(curl -sf "${TERMUX_POOL}/s/sox/" \
                | grep -oP 'href="\K[^"]*'"${TERMUX_ARCH}"'[^"]*\.deb' \
                | grep -v 'dbgsym\|dev\|doc' | head -1 || true)
              if [ -n "$_SOX_DEB" ]; then
                curl -fsSL "${TERMUX_POOL}/s/sox/${_SOX_DEB}" -o "/tmp/sox2_${TERMUX_ARCH}.deb"
                _SOX_DIR="/tmp/deb_sox2_${TERMUX_ARCH}"
                rm -rf "$_SOX_DIR" && mkdir -p "$_SOX_DIR"
                cd "$_SOX_DIR"
                ar x "/tmp/sox2_${TERMUX_ARCH}.deb"
                _SOX_TAR=$(ls data.tar.* 2>/dev/null | head -1)
                if [ -n "$_SOX_TAR" ]; then
                  tar -xf "$_SOX_TAR" 2>/dev/null || true
                  _SOXI=$(find . -name "soxi" -type f 2>/dev/null | head -1)
                  if [ -n "$_SOXI" ]; then
                    cp "$_SOXI" "$OLDPWD/$BIN_DEST/soxi"
                    chmod 755 "$OLDPWD/$BIN_DEST/soxi"
                    echo "      ✅ sox-soxi bundled"
                  else
                    # soxi is often a symlink to sox in newer versions
                    ln -sf sox "$OLDPWD/$BIN_DEST/soxi"
                    echo "      ✅ sox-soxi (symlink to sox)"
                  fi
                fi
                cd "$OLDPWD"
                rm -rf "$_SOX_DIR" "/tmp/sox2_${TERMUX_ARCH}.deb"
              fi
            fi

            # ── yt-dlp ───────────────────────────────────────────────────────
            # yt-dlp in Termux is a Python script (arch-independent)
            # Pool letter 'y', dir 'yt-dlp', binary 'usr/bin/yt-dlp'
            extract_termux_bin "y" "yt-dlp" "yt-dlp" "usr/bin/yt-dlp" "$BIN_DEST/yt-dlp" "$TERMUX_ARCH" || {
              # Fallback: yt-dlp may be arch-independent, try without arch filter
              _YT_DEB=$(curl -sf "${TERMUX_POOL}/y/yt-dlp/" \
                | grep -oP 'href="\K[^"]*\.deb' \
                | grep -v 'dbgsym\|dev\|doc' | head -1 || true)
              if [ -n "$_YT_DEB" ]; then
                curl -fsSL "${TERMUX_POOL}/y/yt-dlp/${_YT_DEB}" -o "/tmp/ytdlp.deb"
                _YT_DIR="/tmp/deb_ytdlp"
                rm -rf "$_YT_DIR" && mkdir -p "$_YT_DIR"
                cd "$_YT_DIR"
                ar x "/tmp/ytdlp.deb"
                _YT_TAR=$(ls data.tar.* 2>/dev/null | head -1)
                if [ -n "$_YT_TAR" ]; then
                  tar -xf "$_YT_TAR" 2>/dev/null || true
                  _YT=$(find . -name "yt-dlp" -type f 2>/dev/null | head -1)
                  if [ -n "$_YT" ]; then
                    cp "$_YT" "$OLDPWD/$BIN_DEST/yt-dlp"
                    chmod 755 "$OLDPWD/$BIN_DEST/yt-dlp"
                    echo "      ✅ yt-dlp bundled (fallback)"
                  fi
                fi
                cd "$OLDPWD"
                rm -rf "$_YT_DIR" "/tmp/ytdlp.deb"
              else
                echo "      ⚠️  yt-dlp not available in Termux pool, skipping (optional)"
              fi
            }

            # ── nano ─────────────────────────────────────────────────────────
            extract_termux_bin "n" "nano" "nano" "usr/bin/nano" "$BIN_DEST/nano" "$TERMUX_ARCH"

            # ── vim ──────────────────────────────────────────────────────────
            # In Termux: vim binary is vim.basic inside vim-runtime package (pool v/vim-runtime/)
            # The basename fallback in extract_termux_bin will find vim.basic and copy as vim
            extract_termux_bin "v" "vim-runtime" "vim" "usr/bin/vim.basic" "$BIN_DEST/vim" "$TERMUX_ARCH" || \
              extract_termux_bin "v" "vim" "vim" "usr/bin/vim" "$BIN_DEST/vim" "$TERMUX_ARCH" || \
              echo "      ⚠️  vim not available, skipping (optional)"

            # ── pv (pipe viewer) ─────────────────────────────────────────────
            extract_termux_bin "p" "pv" "pv" "usr/bin/pv" "$BIN_DEST/pv" "$TERMUX_ARCH"

            # ── file ─────────────────────────────────────────────────────────
            extract_termux_bin "f" "file" "file" "usr/bin/file" "$BIN_DEST/file" "$TERMUX_ARCH"

            # ── patch ────────────────────────────────────────────────────────
            extract_termux_bin "p" "patch" "patch" "usr/bin/patch" "$BIN_DEST/patch" "$TERMUX_ARCH"

            # ── diffutils ────────────────────────────────────────────────────
            extract_termux_bin "d" "diffutils" "diffutils" "usr/bin/diff" "$BIN_DEST/diff" "$TERMUX_ARCH"

            # ── rsync ────────────────────────────────────────────────────────
            extract_termux_bin "r" "rsync" "rsync" "usr/bin/rsync" "$BIN_DEST/rsync" "$TERMUX_ARCH"

            # ── p7zip ────────────────────────────────────────────────────────
            extract_termux_bin "p" "p7zip" "p7zip" "usr/bin/7z" "$BIN_DEST/7z" "$TERMUX_ARCH"

            # ── lz4 ──────────────────────────────────────────────────────────
            extract_termux_bin "l" "lz4" "lz4" "usr/bin/lz4" "$BIN_DEST/lz4" "$TERMUX_ARCH"

            # ── zstd ─────────────────────────────────────────────────────────
            extract_termux_bin "z" "zstd" "zstd" "usr/bin/zstd" "$BIN_DEST/zstd" "$TERMUX_ARCH"

            # ── xz-utils ─────────────────────────────────────────────────────
            extract_termux_bin "x" "xz-utils" "xz-utils" "usr/bin/xz" "$BIN_DEST/xz" "$TERMUX_ARCH"

            # ── procps (ps, top, free, pgrep, pkill) ─────────────────────────
            extract_termux_bin "p" "procps" "procps" "usr/bin/ps" "$BIN_DEST/ps" "$TERMUX_ARCH"
            extract_termux_bin "p" "procps" "procps-free" "usr/bin/free" "$BIN_DEST/free" "$TERMUX_ARCH"
            extract_termux_bin "p" "procps" "procps-pgrep" "usr/bin/pgrep" "$BIN_DEST/pgrep" "$TERMUX_ARCH"
            extract_termux_bin "p" "procps" "procps-pkill" "usr/bin/pkill" "$BIN_DEST/pkill" "$TERMUX_ARCH"

            # ── exiftool ─────────────────────────────────────────────────────
            # Termux package: libimage-exiftool-perl (pool l/) or perl-image-exiftool (pool p/)
            # Binary path: usr/bin/exiftool
            extract_termux_bin "l" "libimage-exiftool-perl" "exiftool" "usr/bin/exiftool" "$BIN_DEST/exiftool" "$TERMUX_ARCH" || true
            if [ ! -f "$BIN_DEST/exiftool" ]; then
              extract_termux_bin "p" "perl-image-exiftool" "exiftool" "usr/bin/exiftool" "$BIN_DEST/exiftool" "$TERMUX_ARCH" || true
            fi
            if [ ! -f "$BIN_DEST/exiftool" ]; then
              echo "      ⚠️  exiftool not available for $TERMUX_ARCH, skipping (optional)"
            fi

            # ── openssh ──────────────────────────────────────────────────────
            extract_termux_bin "o" "openssh" "openssh" "usr/bin/ssh" "$BIN_DEST/ssh" "$TERMUX_ARCH"
            extract_termux_bin "o" "openssh" "openssh-scp" "usr/bin/scp" "$BIN_DEST/scp" "$TERMUX_ARCH"
            extract_termux_bin "o" "openssh" "openssh-keygen" "usr/bin/ssh-keygen" "$BIN_DEST/ssh-keygen" "$TERMUX_ARCH"

            # ── strace ───────────────────────────────────────────────────────
            extract_termux_bin "s" "strace" "strace" "usr/bin/strace" "$BIN_DEST/strace" "$TERMUX_ARCH"

            echo ""
            echo "    📋 bin/ inventory ($ABI): $(find "$BIN_DEST/" -maxdepth 1 ! -type d | wc -l) files"
            ls -la "$BIN_DEST/" | tail -n +4 | awk '{print "      " $0}' || true

            # ── Launcher scripts ──────────────────────────────────────────────
            mkdir -p "$TOOLS_DIR/$ABI/launcher"

            # Claude Code launcher
            printf '%s\n' \
              '#!/bin/sh' \
              'TOOLS="$(dirname "$(dirname "$0")")" ' \
              'export NODE_PATH="$TOOLS/npm_modules"' \
              'export NODE_NO_WARNINGS=1' \
              'export CLAUDE_CODE_DISABLE_TELEMETRY=1' \
              'exec "$TOOLS/node" "$TOOLS/npm_modules/@anthropic-ai/claude-code/cli.js" "$@"' \
              > "$TOOLS_DIR/$ABI/launcher/claude_code_launcher.sh"
            chmod 755 "$TOOLS_DIR/$ABI/launcher/claude_code_launcher.sh"

            # code-server (VS Code) launcher
            CS_ENTRY_REL="npm_modules/code-server/out/node/entry.js"
            # Try to find real entry point path
            FOUND_ENTRY=$(find "$TOOLS_DIR/$ABI/npm_modules/code-server" -name "entry.js" -path "*/node/entry.js" 2>/dev/null | head -1)
            if [ -n "$FOUND_ENTRY" ]; then
              # Make path relative to $TOOLS_DIR/$ABI
              CS_ENTRY_REL="${FOUND_ENTRY#$TOOLS_DIR/$ABI/}"
            fi
            printf '%s\n' \
              '#!/bin/sh' \
              'TOOLS="$(dirname "$(dirname "$0")")"' \
              'export NODE_PATH="$TOOLS/npm_modules"' \
              'export NODE_NO_WARNINGS=1' \
              'export XDG_DATA_HOME="${TOOLS}/vscode-data"' \
              'export XDG_CONFIG_HOME="${TOOLS}/vscode-config"' \
              'mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME"' \
              "exec \"\$TOOLS/node\" \"\$TOOLS/${CS_ENTRY_REL}\" \"\$@\"" \
              > "$TOOLS_DIR/$ABI/launcher/code_server_launcher.sh"
            chmod 755 "$TOOLS_DIR/$ABI/launcher/code_server_launcher.sh"
            echo "    ✅ Launchers created"

            # ── Pack per-ABI tarball ──────────────────────────────────────────
            echo "    📦 Creating tools_${ABI}.tar.gz ..."
            tar -czf "$TOOLS_DIR/tools_${ABI}.tar.gz" \
              -C "$TOOLS_DIR" \
              "$ABI"
            TARBALL_SIZE=$(du -sh "$TOOLS_DIR/tools_${ABI}.tar.gz" | cut -f1)
            echo "    ✅ tools_${ABI}.tar.gz  ($TARBALL_SIZE)"

            # Clean up unpacked dir
            rm -rf "$TOOLS_DIR/$ABI"
          done

          # ── Generate tools_manifest.json ──────────────────────────────────
          ABIS_JSON=$(echo "$ABIS" | tr ' ' '\n' | \
            python3 -c "import sys,json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          python3 << PYEOF2
          import json
          manifest = {
              "schema_version": 3,
              "built_at": "${BUILD_DATE}",
              "run_id": "${{ github.run_id }}",
              "node_version": "${NODE_VERSION}",
              "claude_code_version": "${CLAUDE_CODE_VERSION}",
              "code_server_version": "${{ steps.resolve-codeserver.outputs.cs_version }}",
              "abis": ${ABIS_JSON},
              "tools": [
                "claude-code", "code-server",
                "git", "ripgrep", "curl", "wget", "jq",
                "busybox", "python3",
                "zip", "unzip", "sqlite3",
                "ffmpeg", "ffprobe", "imagemagick",
                "sox", "yt-dlp",
                "nano", "vim", "pv", "file", "patch",
                "diffutils", "rsync", "p7zip",
                "lz4", "zstd", "xz",
                "procps", "exiftool", "openssh", "strace"
              ]
          }
          with open("${TOOLS_DIR}/tools_manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print("  ✅ tools_manifest.json generated")
          PYEOF2

          echo ""
          echo "  ✅ Bundle complete:"
          ls -lh "$TOOLS_DIR/"

      # ── Verify tools bundle before build ─────────────────────────────────

      - name: "✅ Verify tools bundle integrity"
        run: |
          TOOLS_DIR="assets/tools"
          echo "  🔍 Verifying tools bundle..."
          echo "  Cache hit: ${{ steps.cache-tools.outputs.cache-hit }}"
          echo "  Contents of $TOOLS_DIR:"
          ls -lh "$TOOLS_DIR/" 2>/dev/null || echo "  (empty or not found)"

          # Wajib ada tools_manifest.json
          if [ ! -f "$TOOLS_DIR/tools_manifest.json" ]; then
            echo ""
            echo "  ❌ FATAL: tools_manifest.json NOT found in $TOOLS_DIR/"
            echo "  Cache hit was: ${{ steps.cache-tools.outputs.cache-hit }}"
            echo "  This means the bundle step was skipped (cache hit) but cache restore failed,"
            echo "  OR the bundle step itself failed silently."
            echo ""
            echo "  → Fix: Delete the Actions cache named 'tools-bundle-v5-*' in repo settings"
            echo "    and re-run this workflow to force a fresh bundle."
            exit 1
          fi

          # Cek tarball ABI sesuai target
          ABIS="${{ steps.abis.outputs.abis }}"
          for ABI in $ABIS; do
            TARBALL="$TOOLS_DIR/tools_${ABI}.tar.gz"
            if [ ! -f "$TARBALL" ]; then
              echo "  ❌ FATAL: $TARBALL NOT found!"
              exit 1
            fi
            SIZE=$(du -sh "$TARBALL" | cut -f1)
            echo "  ✅ $TARBALL ($SIZE)"

            # Cek isi tarball — harus ada node, claude-code, code-server
            echo "  🔍 Checking tarball contents for $ABI..."
            # Use arithmetic to avoid "[: 0\n: integer expression expected" from grep -c + $()
            HAS_NODE=0;    tar -tzf "$TARBALL" 2>/dev/null | grep -q "${ABI}/node$"                       && HAS_NODE=1    || true
            HAS_CC=0;      tar -tzf "$TARBALL" 2>/dev/null | grep -q "@anthropic-ai/claude-code/cli.js"   && HAS_CC=1      || true
            HAS_CS=0;      tar -tzf "$TARBALL" 2>/dev/null | grep -q "code-server"                        && HAS_CS=1      || true
            HAS_GIT=0;     tar -tzf "$TARBALL" 2>/dev/null | grep -q "bin/git$"                           && HAS_GIT=1     || true
            HAS_PYTHON=0;  tar -tzf "$TARBALL" 2>/dev/null | grep -q "bin/python3$"                       && HAS_PYTHON=1  || true
            HAS_BUSYBOX=0; tar -tzf "$TARBALL" 2>/dev/null | grep -q "bin/busybox$"                       && HAS_BUSYBOX=1 || true
            HAS_CURL=0;    tar -tzf "$TARBALL" 2>/dev/null | grep -q "bin/curl$"                          && HAS_CURL=1    || true
            HAS_FFMPEG=0;  tar -tzf "$TARBALL" 2>/dev/null | grep -q "bin/ffmpeg$"                        && HAS_FFMPEG=1  || true
            HAS_JQ=0;      tar -tzf "$TARBALL" 2>/dev/null | grep -q "bin/jq$"                            && HAS_JQ=1      || true
            [ "$HAS_NODE" -gt 0 ]    && echo "    ✅ node"       || echo "    ⚠️  node NOT found"
            [ "$HAS_CC" -gt 0 ]      && echo "    ✅ claude-code" || echo "    ⚠️  claude-code NOT found"
            [ "$HAS_CS" -gt 0 ]      && echo "    ✅ code-server" || echo "    ⚠️  code-server NOT found"
            [ "$HAS_GIT" -gt 0 ]     && echo "    ✅ git"         || echo "    ⚠️  git NOT found"
            [ "$HAS_PYTHON" -gt 0 ]  && echo "    ✅ python3"     || echo "    ⚠️  python3 NOT found"
            [ "$HAS_BUSYBOX" -gt 0 ] && echo "    ✅ busybox"     || echo "    ⚠️  busybox NOT found"
            [ "$HAS_CURL" -gt 0 ]    && echo "    ✅ curl"        || echo "    ⚠️  curl NOT found"
            [ "$HAS_FFMPEG" -gt 0 ]  && echo "    ✅ ffmpeg"      || echo "    ⚠️  ffmpeg NOT found"
            [ "$HAS_JQ" -gt 0 ]      && echo "    ✅ jq"          || echo "    ⚠️  jq NOT found"
          done

          echo "  ✅ tools_manifest.json:"
          cat "$TOOLS_DIR/tools_manifest.json"
          echo ""
          echo "  ✅ All tools verified — proceeding to Flutter build."

      # ── SESSION_02: Build Flutter APK ─────────────────────────────────────

      - name: "📌 Resolve llama.cpp tag"
        id: resolve-tag
        run: |
          curl -sf https://api.github.com/repos/ggerganov/llama.cpp/releases \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['tag_name'])" > /tmp/llama_tag 2>/dev/null || echo "b3965" > /tmp/llama_tag
          LLAMA_TAG=$(cat /tmp/llama_tag)
          echo "llama_tag=$LLAMA_TAG" >> "$GITHUB_OUTPUT"
          echo "  📌 llama.cpp: $LLAMA_TAG"

      - name: "🏗️ Build APK arm64 (release)"
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'apk-release-arm64'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-arm64" || true
          flutter build apk --release --target-platform=android-arm64 $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1)  app-release.apk"

      - name: "📤 Upload arm64 APK → GitHub Release"
        if: |
          github.event_name == 'push' ||
          github.event.inputs.build_target == 'apk-release' ||
          github.event.inputs.build_target == 'apk-release-arm64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FNAME="KanMon GO-arm64-v${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-release.apk" "$FNAME"
          TAG="gf-latest-arm64"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO arm64 #${{ github.run_number }}" \
            --notes "arm64 release build #${{ github.run_number }}"

      - name: "✂️ Build APK Split per ABI"
        if: |
          github.event.inputs.build_target == 'apk-split-abi' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-split" || true
          flutter build apk --release --split-per-abi $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}

      - name: "📤 Upload Split APKs → GitHub Release"
        if: |
          github.event.inputs.build_target == 'apk-split-abi' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "KanMon GO-arm64-v${{ github.run_number }}.apk"
          cp "build/app/outputs/flutter-apk/app-x86_64-release.apk"    "KanMon GO-x86_64-v${{ github.run_number }}.apk"
          TAG="gf-latest-split"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" \
            "KanMon GO-arm64-v${{ github.run_number }}.apk" \
            "KanMon GO-x86_64-v${{ github.run_number }}.apk" \
            --title "KanMon GO Split APK #${{ github.run_number }}" \
            --notes "Split per ABI build #${{ github.run_number }}"

      - name: "📦 Build AAB"
        if: |
          github.event.inputs.build_target == 'aab' ||
          github.event.inputs.build_target == 'all-android'
        env:
          KEYSTORE_PATH:      ${{ github.workspace }}/android/app/keystore.jks
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS:          ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:       ${{ secrets.KEY_PASSWORD }}
        run: |
          [ ! -f "android/app/keystore.jks" ] || [ -z "$KEY_STORE_PASSWORD" ] && unset KEYSTORE_PATH || true
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] && [ -n "$KEYSTORE_PATH" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-aab" || true
          flutter build appbundle --release $OBFSTR --dart-define=CODE_SERVER_VERSION=${{ steps.resolve-codeserver.outputs.cs_version }}
          echo "  📦 $(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1)  app-release.aab"

      - name: "📤 Upload AAB → GitHub Release"
        if: |
          github.event.inputs.build_target == 'aab' ||
          github.event.inputs.build_target == 'all-android'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FNAME="KanMon GO-playstore-v${{ github.run_number }}.aab"
          cp "build/app/outputs/bundle/release/app-release.aab" "$FNAME"
          TAG="gf-latest-aab"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO AAB #${{ github.run_number }}" \
            --notes "AAB Play Store build #${{ github.run_number }}"

      - name: "🗑️ Remove keystore"
        if: always()
        run: rm -f android/app/keystore.jks

      - name: "📋 Build summary"
        if: always()
        run: |
          echo "════════════════════════════════════════════════"
          echo "  KanMon GO — Build Summary"
          echo "  Target      : ${{ github.event_name == 'push' && 'apk-release' || github.event.inputs.build_target }}"
          echo "  Channel     : ${{ github.event.inputs.flutter_channel || 'stable' }}"
          echo "  Run #       : ${{ github.run_number }}"
          echo "  Status      : ${{ job.status }}"
          echo "  llama       : ${{ steps.resolve-tag.outputs.llama_tag }}"
          echo "  Node.js     : ${{ steps.resolve-nodejs.outputs.node_version }}"
          echo "  code-server : ${{ steps.resolve-codeserver.outputs.cs_version }}"
          echo "  Bundled     : claude-code, code-server, git, ripgrep, curl, wget, jq,"
          echo "                busybox, python3, zip, sqlite3, ffmpeg, imagemagick,"
          echo "                sox, yt-dlp, nano, vim, pv, file, patch, diffutils,"
          echo "                rsync, p7zip, lz4, zstd, xz, procps, exiftool,"
          echo "                openssh, strace"
          echo "════════════════════════════════════════════════"
          ccache --show-stats 2>/dev/null || true

# ══════════════════════════════════════════════════════════════════════════════
  ios:
    name: "🍎 iOS Build"
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write

    if: github.event.inputs.build_target == 'ios'

    steps:

      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🐦 Flutter (${{ github.event.inputs.flutter_channel || 'stable' }})"
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ github.event.inputs.flutter_channel || 'stable' }}
          cache: true

      - name: "🗑️ Remove sensitive files"
        run: |
          rm -f CLAUDE.md .env secrets.json
          find . -maxdepth 1 -name "*.md" ! -name "README.md" -delete 2>/dev/null || true

      - name: "🔑 Install iOS certificate & provisioning"
        id: ios_sign
        env:
          IOS_CERTIFICATE_P12:   ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PWD:   ${{ secrets.IOS_CERTIFICATE_PWD }}
          IOS_PROVISION_PROFILE: ${{ secrets.IOS_PROVISION_PROFILE }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            KCHAIN="$RUNNER_TEMP/kf.keychain-db"
            KPWD="kf-ci-$(date +%s)"
            security create-keychain -p "$KPWD" "$KCHAIN"
            security set-keychain-settings -lut 21600 "$KCHAIN"
            security unlock-keychain -p "$KPWD" "$KCHAIN"
            security list-keychain -d user -s "$KCHAIN"
            echo "$IOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "$IOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KPWD" "$KCHAIN" 2>/dev/null || true
            if [ -n "$IOS_PROVISION_PROFILE" ]; then
              PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
              mkdir -p "$PP_DIR"
              echo "$IOS_PROVISION_PROFILE" | base64 --decode > "$PP_DIR/kf.mobileprovision"
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: "📦 Cache pub"
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ios-pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      - name: "📦 flutter pub get"
        run: flutter pub get

      - name: "🍎 pod install"
        run: cd ios && pod install --repo-update

      - name: "🏗️ Build iOS — no codesign"
        if: steps.ios_sign.outputs.signed != 'true'
        run: flutter build ios --release --no-codesign --dart-define=CODE_SERVER_VERSION=4.96.2

      - name: "📤 Upload iOS (no-sign) → GitHub Release"
        if: steps.ios_sign.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/ios/iphoneos
          zip -r "KanMon GO-ios-nosign-v${{ github.run_number }}.zip" Runner.app
          TAG="gf-latest-ios-nosign"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "KanMon GO-ios-nosign-v${{ github.run_number }}.zip" \
            --title "KanMon GO iOS no-sign #${{ github.run_number }}" \
            --notes "iOS no-sign build #${{ github.run_number }}" \
            --prerelease

      - name: "🏗️ Build iOS IPA (signed)"
        if: steps.ios_sign.outputs.signed == 'true'
        run: |
          OBFSTR=""
          [ "${{ github.event.inputs.enable_obfuscation }}" != "false" ] \
            && OBFSTR="--obfuscate --split-debug-info=build/debug-info-ios" || true
          flutter build ipa --release $OBFSTR --dart-define=CODE_SERVER_VERSION=4.96.2

      - name: "📤 Upload IPA → GitHub Release"
        if: steps.ios_sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IPA=$(find build/ios/ipa -name "*.ipa" | head -1)
          FNAME="KanMon GO-v${{ github.run_number }}.ipa"
          cp "$IPA" "$FNAME"
          TAG="gf-latest-ios"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$FNAME" \
            --title "KanMon GO iOS #${{ github.run_number }}" \
            --notes "iOS IPA build #${{ github.run_number }}"

      - name: "🗑️ Remove keychain"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kf.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12"
