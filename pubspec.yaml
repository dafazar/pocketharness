name: kanmongo
description: KanMon GO — Aplikasi AI Cerdas
publish_to: 'none'
version: 2.1.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── Storage (lokal) ───────────────────────────────────────────────────────
  shared_preferences: ^2.3.2
  sqflite_sqlcipher: ^3.0.1+2
  path: ^1.9.0
  path_provider: ^2.1.4

  # ── Firebase Core & Services ──────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3
  crypto: ^3.0.3

  # ── Authentication Providers ──────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── In-App Purchase / Membership ──────────────────────────────────────────
  purchases_flutter: ^8.0.0

  # ── Network ───────────────────────────────────────────────────────────────
  http: ^1.2.2
  html: ^0.15.4
  mime: ^2.0.0
  share_plus: ^10.1.4
  webview_flutter: ^4.8.0
  url_launcher: ^6.3.0
  process_run: ^0.14.2
  connectivity_plus: ^6.1.0

  # ── UI & Animation ────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.69.0

  # ── Media & Files ─────────────────────────────────────────────────────────
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  file_picker: ^8.1.2
  open_file: ^3.0.4
  video_player: ^2.9.1
  camera: ^0.11.0+2
  photo_manager: ^3.3.0
  saver_gallery: ^3.0.10          # ganti image_gallery_saver (namespace error AGP)
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0

  # ── OCR ───────────────────────────────────────────────────────────────────
  google_mlkit_text_recognition: ^0.13.1

  # ── Documents ─────────────────────────────────────────────────────────────
  syncfusion_flutter_pdfviewer: ^27.1.48
  archive: ^4.0.0
  xml: ^6.5.0

  # ── Utils ─────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.5.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

  # ── AI Arsitektur (PocketPal) ─────────────────────────────────────────────
  freezed_annotation: ^2.4.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_markdown: ^0.7.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  json_serializable: ^6.8.0
  freezed: ^2.5.2


flutter:
  uses-material-design: true

  assets:
    - assets/database/
    - assets/sounds/
    - assets/web/
    - assets/fonts/
    - assets/icons/
    - assets/icons/ui/
    - assets/icons/content/
    - assets/theme/
    - assets/theme/banners/
    - assets/theme/backgrounds/
    - assets/theme/menus/
    - assets/theme/quiz/
    - assets/theme/flashcard/
    - assets/theme/notes/
    - assets/theme/swatches/
    - assets/theme/kana/
    - assets/theme/placeholders/
